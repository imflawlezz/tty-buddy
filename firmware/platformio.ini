; ESP32-C3 SuperMini + ST7789 320×240 (TFT_eSPI).
; Pins: see hardware/wiring.md (BL=GPIO5 PWM, SW1=GPIO10; TFT_BL unset).

; Default to the device build. Use `pio test -e native` for host unit tests —
; a plain `pio run -e native` has no main() (tests supply it).
[platformio]
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; SuperMini uses USB-CDC (no external UART).
; ESP32-C3 USB-Serial-JTAG VID/PID/product strings are fixed in silicon —
; the host bridge tags the port as tty-buddy (/tmp/tty-buddy) instead.
board_build.flash_mode = dio
; Patch TFT_eSPI C3 SPI_PORT before compile (scripts/fix_tft_espi_c3.py).
extra_scripts = pre:scripts/fix_tft_espi_c3.py
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; Prefer include/User_Setup.h over the library default.
	-DUSER_SETUP_LOADED=1
	-include include/User_Setup.h

lib_deps =
	bodmer/TFT_eSPI@^2.5.43

; Native host unit tests (protocol / StatusSnap only).
[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
	+<protocol.cpp>
	-<main.cpp>
	-<terminal.cpp>
	-<status_ui.cpp>
