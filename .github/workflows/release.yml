name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for a draft release (e.g. v0.1.0). Empty = package only."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  firmware:
    name: firmware
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' daemon/Cargo.toml | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            firmware/.pio
          key: pio-release-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/include/**', 'firmware/src/**', 'firmware/scripts/**') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: make firmware

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.ver.outputs.version }}
          path: dist/tty-buddy-firmware-${{ steps.ver.outputs.version }}.bin
          if-no-files-found: error

  daemon:
    name: daemon (${{ matrix.deb_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            runs-on: ubuntu-latest
          - deb_arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' daemon/Cargo.toml | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install daemon deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev dpkg-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
          key: ${{ matrix.deb_arch }}

      - name: Build .deb + tarball
        run: |
          DEST=dist ./daemon/packaging/build-deb.sh ${{ matrix.deb_arch }}
          DEST=dist ./daemon/packaging/build-linux-release.sh ${{ matrix.deb_arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.deb_arch }}-${{ steps.ver.outputs.version }}
          path: |
            dist/tty-buddy_${{ steps.ver.outputs.version }}_${{ matrix.deb_arch }}.deb
            dist/tty-buddy-${{ steps.ver.outputs.version }}-*-linux.tar.gz
          if-no-files-found: error

  release:
    name: draft release
    needs: [firmware, daemon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' daemon/Cargo.toml | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.ver.outputs.version }}"
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "Tag v$TAG does not match daemon/Cargo.toml version $VERSION" >&2
            exit 1
          fi

      - name: Extract changelog section
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES="$(mktemp)"
          chmod +x scripts/changelog-section.sh
          ./scripts/changelog-section.sh "$VERSION" CHANGELOG.md | tee "$NOTES"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums.txt
        run: |
          chmod +x scripts/write-checksums.sh
          ./scripts/write-checksums.sh dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload workflow bundle
        uses: actions/upload-artifact@v4
        with:
          name: tty-buddy-${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${{ github.event.inputs.tag }}"
            [[ "$TAG" == v* ]] || TAG="v$TAG"
          fi

          NOTES="${{ steps.notes.outputs.path }}"
          FW="dist/tty-buddy-firmware-${VERSION}.bin"
          DEB_AMD="dist/tty-buddy_${VERSION}_amd64.deb"
          DEB_ARM="dist/tty-buddy_${VERSION}_arm64.deb"
          TGZ_AMD="dist/tty-buddy-${VERSION}-x86_64-linux.tar.gz"
          TGZ_ARM="dist/tty-buddy-${VERSION}-aarch64-linux.tar.gz"
          SUMS="dist/checksums.txt"
          test -f "$FW" && test -f "$DEB_AMD" && test -f "$DEB_ARM"
          test -f "$TGZ_AMD" && test -f "$TGZ_ARM" && test -s "$NOTES" && test -s "$SUMS"

          FILES=("$FW" "$DEB_AMD" "$DEB_ARM" "$TGZ_AMD" "$TGZ_ARM" "$SUMS")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --draft=true --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --draft \
              --title "$TAG" \
              --notes-file "$NOTES"
          fi
