name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for a draft release (e.g. v0.1.0). Empty = package only."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: build + draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' daemon/Cargo.toml | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version=$VERSION"

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.ver.outputs.version }}"
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "Tag v$TAG does not match daemon/Cargo.toml version $VERSION" >&2
            exit 1
          fi

      - name: Extract changelog section
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES="$(mktemp)"
          chmod +x scripts/changelog-section.sh
          ./scripts/changelog-section.sh "$VERSION" CHANGELOG.md | tee "$NOTES"
          if [[ ! -s "$NOTES" ]]; then
            echo "No Keep a Changelog section for [$VERSION] in CHANGELOG.md" >&2
            exit 1
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Install daemon deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            firmware/.pio
          key: pio-release-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/include/**', 'firmware/src/**', 'firmware/scripts/**') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build release artifacts
        run: make release

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tty-buddy-${{ steps.ver.outputs.version }}
          path: |
            dist/tty-buddy-firmware-${{ steps.ver.outputs.version }}.bin
            dist/tty-buddy-firmware.bin
            dist/tty-buddy-${{ steps.ver.outputs.version }}-x86_64-linux.tar.gz
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${{ github.event.inputs.tag }}"
            [[ "$TAG" == v* ]] || TAG="v$TAG"
          fi

          FW="dist/tty-buddy-firmware-${VERSION}.bin"
          TGZ="dist/tty-buddy-${VERSION}-x86_64-linux.tar.gz"
          NOTES="${{ steps.notes.outputs.path }}"
          test -f "$FW" && test -f "$TGZ" && test -s "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FW" "$TGZ" --clobber
            gh release edit "$TAG" --draft=true --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$FW" "$TGZ" \
              --draft \
              --title "$TAG" \
              --notes-file "$NOTES"
          fi
